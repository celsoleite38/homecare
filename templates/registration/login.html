{% extends 'base.html' %}
{% block title %}Entrar - HomeCare{% endblock %}
{% block content %}
<div class='max-w-md mx-auto mt-16 bg-white rounded-3xl shadow p-8'>
    <h1 class='text-3xl font-semibold'>Entrar</h1>
    <p class='text-slate-500 mt-2'>Digite suas credenciais para acessar o sistema.</p>
    <form method='post' class='space-y-6 mt-8'>
        {% csrf_token %}
        <div>
            <label class='block text-sm font-medium text-slate-700'>Usuário</label>
            <input type='text' name='username' class='mt-2 w-full border border-slate-200 rounded-3xl px-4 py-3' required>
        </div>
        <div>
            <label class='block text-sm font-medium text-slate-700'>Senha</label>
            <input type='password' name='password' class='mt-2 w-full border border-slate-200 rounded-3xl px-4 py-3' required>
        </div>
        <button type='submit' class='w-full bg-sky-600 hover:bg-sky-700 text-white py-3 rounded-3xl'>Entrar</button>
    </form>
    <p class='text-center text-sm text-slate-500 mt-6'>
        Se este for o primeiro HomeCare, <a href='/accounts/signup/' class='text-sky-600 hover:text-sky-500'>clique aqui para cadastrar</a>.
    </p>
</div>
{% endblock %}
