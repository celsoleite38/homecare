{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ titulo }} - HomeCare{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <a href="{{ voltar_url }}" class="text-slate-500 hover:text-slate-900">← Voltar</a>
        <h1 class="text-3xl font-semibold mt-4">{{ titulo }}</h1>
        <p class="text-slate-500 mt-2">{{ descricao }}</p>
    </div>
    <div class="bg-white rounded-3xl shadow p-8">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div class="grid gap-6 lg:grid-cols-2">
                {{ form|crispy }}
            </div>
            <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-3 rounded-3xl">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
